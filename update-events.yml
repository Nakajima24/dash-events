name: Update events feed

# Runs every Monday at 08:00 UTC (weekly), and on demand from the Actions
# tab. Commits events.json only when it actually changed.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build events.json
        run: python scrape_events.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain events.json)" ]]; then
            git config user.name  "dash-events-bot"
            git config user.email "actions@github.com"
            git add events.json
            git commit -m "Weekly events refresh"
            git push
          else
            echo "No changes."
          fi
